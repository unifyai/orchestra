name: Publish Orchestra image for self-host

on:
  push:
    branches: [staging, main]
    paths:
    - '.dockerignore'
    - 'deploy/**'
    - 'orchestra/**'
    - 'pyproject.toml'
    - 'poetry.lock'
    - '.github/workflows/ghcr-selfhost.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-qemu-action@v3
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/build-push-action@v6
      with:
        context: .
        file: deploy/Dockerfile
        target: prod
        platforms: ${{ matrix.platform }}
        push: true
        tags: ghcr.io/unifyai/orchestra:${{ github.sha }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - run: |
        TAG="${{ github.ref_name == 'main' && 'main' || 'staging' }}"
        docker buildx imagetools create -t ghcr.io/unifyai/orchestra:${TAG} \
          ghcr.io/unifyai/orchestra:${{ github.sha }}-amd64 \
          ghcr.io/unifyai/orchestra:${{ github.sha }}-arm64
