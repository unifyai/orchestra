name: pytest release gate

# Dedicated staging->main release gate for the pytest suite.
#
# This workflow exists to make the required "pytest" context safe. It must
# only ever trigger on pull_request(main) or workflow_dispatch -- never push.
# GitHub Actions publishes a "skipped" check run for a job whose `if`
# evaluates false, and branch protection treats a skipped required check as
# satisfied. Scoping just the job's `if:` (as tests.yml's pytest-required
# used to do) still leaves a skipped "pytest" run on every ordinary push,
# which can satisfy the release gate before the real pull_request-triggered
# run for the same SHA finishes. Keeping this gate in a workflow with no push
# trigger at all means an ordinary push produces no check run under this
# context whatsoever -- pending, not a stale pass or a false block.
#
# tests.yml skips its own pytest matrix for pull_request(main) so the suite
# doesn't run twice on a release PR; it remains the everyday, non-required
# signal for pushes and PRs into other branches.

on:
  pull_request:
    branches:
    - main
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest-8-cores
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'staging'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      LOGS_DIR: ${{ github.workspace }}/logs
      POETRY_VIRTUALENVS_CREATE: "false"
    services:
      orchestra-db:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_PASSWORD: orchestra
          POSTGRES_USER: orchestra
          POSTGRES_DB: orchestra
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
        - 5432:5432
    steps:

    - uses: actions/checkout@v4
    - name: Auth into Google Cloud
      id: gcp-auth
      uses: 'google-github-actions/auth@v2'
      # This service account also needs pub/sub
      with:
        credentials_json: '${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Poetry
      run: |
        # Pin pip + virtualenv so poetry's parallel installer doesn't race on
        # site-packages/virtualenv/create/via_global_ref/_virtualenv.py when
        # building git deps (e.g. orchestra). See unifyai/orchestra#1254.
        pip install --upgrade pip
        pip install 'virtualenv>=20.25,<21'
        pip install 'poetry==2.2.1'

    - name: Cache poetry dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pypoetry
        key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
        restore-keys: |
          poetry-${{ runner.os }}-

    - name: Install deps
      run: poetry install
      env:
        POETRY_VIRTUALENVS_CREATE: "false"
        # Serialize installer so parallel git-dep builds don't race on the
        # site-packages virtualenv files.
        POETRY_INSTALLER_PARALLEL: "false"

    - name: Setup logging directory
      run: |
        mkdir -p "$LOGS_DIR/orchestra"
        echo "Created logging directory: $LOGS_DIR/orchestra/"

    - name: Run pytest check
      id: pytest
      run: |
        set +e
        # --color=no ensures no ANSI codes in output (required for summary line parsing)
        poetry run pytest -p no:warnings -vv --color=no --cov="orchestra" -n 8 --shard-id=${{ matrix.shard }} --num-shards=8 . -m "not performance" 2>&1 | tee pytest_output.txt
        exit_code=${PIPESTATUS[0]}
        echo "exit_code=$exit_code" >> $GITHUB_OUTPUT

        # Strip any remaining ANSI codes (from coverage or other plugins) before parsing
        sed -i 's/\x1b\[[0-9;]*m//g' pytest_output.txt

        # Extract pass/fail counts from pytest summary line
        # Format: "====== X passed, Y failed, Z skipped in N.NNs (H:MM:SS) ======"
        summary_line=$(grep -E "^=+ .*(passed|failed|error).* in [0-9]+(\.[0-9]+)?s" pytest_output.txt | tail -1)
        if [ -n "$summary_line" ]; then
          passed=$(echo "$summary_line" | grep -oE "[0-9]+ passed" | grep -oE "[0-9]+" || echo "0")
          failed=$(echo "$summary_line" | grep -oE "[0-9]+ failed" | grep -oE "[0-9]+" || echo "0")
          skipped=$(echo "$summary_line" | grep -oE "[0-9]+ skipped" | grep -oE "[0-9]+" || echo "0")
          errors=$(echo "$summary_line" | grep -oE "[0-9]+ error" | grep -oE "[0-9]+" || echo "0")
          echo "passed=${passed:-0}" >> $GITHUB_OUTPUT
          echo "failed=${failed:-0}" >> $GITHUB_OUTPUT
          echo "skipped=${skipped:-0}" >> $GITHUB_OUTPUT
          echo "errors=${errors:-0}" >> $GITHUB_OUTPUT
        else
          # Debug: show last 5 lines to help diagnose parsing issues
          echo "Warning: Could not parse pytest summary line" >&2
          echo "Last 5 lines of output:" >&2
          tail -5 pytest_output.txt >&2
          echo "passed=0" >> $GITHUB_OUTPUT
          echo "failed=0" >> $GITHUB_OUTPUT
          echo "skipped=0" >> $GITHUB_OUTPUT
          echo "errors=0" >> $GITHUB_OUTPUT
        fi

        exit $exit_code
      env:
        ORCHESTRA_HOST: "0.0.0.0"
        ORCHESTRA_DB_HOST: localhost
        ORCHESTRA_DB_USER: orchestra
        ORCHESTRA_DB_PASS: orchestra
        ORCHESTRA_DB_BASE: orchestra
        # Fail the run if any application-issued log query can't prune by
        # project_id (the partitioned log_event/log_event_context/embedding
        # tables fan out across every tenant otherwise -- the June production
        # slowdown). Test/seed/ORM-internal queries (no app call site) are not
        # gated. See orchestra/tests/partition_prune_guard.py.
        PARTITION_PRUNE_GUARD: strict
        # Logging
        ORCHESTRA_LOG_DIR: ${{ env.LOGS_DIR }}/orchestra
        # GCP configuration (from org-level variables)
        GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.gcp-auth.outputs.credentials_file_path }}
        ORCHESTRA_GCP_BUCKET_NAME: ${{ vars.GCP_BUCKET_LOGS }}
        ORCHESTRA_GCP_ASSISTANT_MEDIA_BUCKET_NAME: ${{ vars.GCP_BUCKET_ASSISTANT_IMAGES }}
        # OpenRouter API key (used for OpenAI-compatible model calls)
        ORCHESTRA_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY_CI }}
        TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
        ORCHESTRA_TOGETHER_AI_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
        # Orchestra-specific configuration
        ORCHESTRA_ADMIN_KEY: ${{ secrets.ORCHESTRA_ADMIN_KEY }}
        AUTH_ACCOUNT_API_KEY: ${{ vars.AUTH_ACCOUNT_API_KEY }}
        AUTH_ACCOUNT_USER_ID: ${{ vars.AUTH_ACCOUNT_USER_ID }}

    - name: Generate success summary
      if: success()
      run: |
        ARTIFACTS_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts"
        PASSED="${{ steps.pytest.outputs.passed }}"
        SKIPPED="${{ steps.pytest.outputs.skipped }}"

        # Count trace files
        TRACE_COUNT=0
        if [ -d "$LOGS_DIR/orchestra/requests" ]; then
          TRACE_COUNT=$(find "$LOGS_DIR/orchestra/requests" -name "*.json" -type f 2>/dev/null | wc -l | tr -d ' ')
        fi

        echo "## ✅ Shard ${{ matrix.shard }}: All Tests Passed" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        STATS="**${PASSED}** passed"
        [ "$SKIPPED" -gt 0 ] 2>/dev/null && STATS="$STATS, **${SKIPPED}** skipped"
        echo "$STATS" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📦 Artifacts" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**${TRACE_COUNT}** request traces captured → [**Download logs-shard-${{ matrix.shard }}**]($ARTIFACTS_URL)" >> $GITHUB_STEP_SUMMARY

    - name: Generate failure summary
      if: failure()
      run: |
        ARTIFACTS_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts"
        PASSED="${{ steps.pytest.outputs.passed }}"
        FAILED="${{ steps.pytest.outputs.failed }}"
        SKIPPED="${{ steps.pytest.outputs.skipped }}"
        ERRORS="${{ steps.pytest.outputs.errors }}"

        # Count trace files
        TRACE_COUNT=0
        if [ -d "$LOGS_DIR/orchestra/requests" ]; then
          TRACE_COUNT=$(find "$LOGS_DIR/orchestra/requests" -name "*.json" -type f 2>/dev/null | wc -l | tr -d ' ')
        fi

        echo "## ❌ Shard ${{ matrix.shard }}: Tests Failed" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        STATS="**${PASSED}** passed"
        [ "$FAILED" -gt 0 ] 2>/dev/null && STATS="$STATS, **${FAILED}** failed"
        [ "$ERRORS" -gt 0 ] 2>/dev/null && STATS="$STATS, **${ERRORS}** errors"
        [ "$SKIPPED" -gt 0 ] 2>/dev/null && STATS="$STATS, **${SKIPPED}** skipped"
        echo "$STATS" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📦 Artifacts" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**${TRACE_COUNT}** request traces captured → [**Download logs-shard-${{ matrix.shard }}**]($ARTIFACTS_URL)" >> $GITHUB_STEP_SUMMARY

    - name: Prepare logs for upload
      if: always()
      run: |
        echo "=== Preparing logs for upload ==="

        if [ -d "$LOGS_DIR/orchestra" ]; then
          # Sanitize filenames for cross-platform compatibility (Windows NTFS).
          # Invalid characters: " : < > | * ? \r \n
          # This is a fallback; the exporter should already sanitize these.
          sanitized=0
          failed=0
          while IFS= read -r -d '' file; do
            dir=$(dirname "$file")
            base=$(basename "$file")
            # Replace all NTFS-invalid characters with underscores
            newbase=$(echo "$base" | tr ':"<>|*?' '_____?_' | tr -d '\r\n')
            newname="$dir/$newbase"
            if [ "$file" != "$newname" ]; then
              if mv "$file" "$newname" 2>&1; then
                ((sanitized++)) || true
              else
                echo "  ⚠ Failed to rename: $file"
                ((failed++)) || true
              fi
            fi
          done < <(find "$LOGS_DIR/orchestra" -type f \( -name '*:*' -o -name '*"*' -o -name '*<*' -o -name '*>*' -o -name '*|*' -o -name '*?*' \) -print0 2>/dev/null || true)

          # Count files by type
          total_files=$(find "$LOGS_DIR/orchestra" -type f 2>/dev/null | wc -l | tr -d ' ')
          trace_files=0
          if [ -d "$LOGS_DIR/orchestra/requests" ]; then
            trace_files=$(find "$LOGS_DIR/orchestra/requests" -name "*.json" -type f 2>/dev/null | wc -l | tr -d ' ')
          fi

          echo "✓ orchestra logs: $total_files files total"
          echo "  - $trace_files request traces (JSON)"
          if [ "$sanitized" -gt 0 ]; then
            echo "  - $sanitized filenames sanitized"
          fi
          if [ "$failed" -gt 0 ]; then
            echo "  ⚠ $failed filenames failed to sanitize"
          fi
        else
          echo "○ orchestra logs: directory not found"
          echo "  (No traces captured - check ORCHESTRA_LOG_DIR env var)"
        fi

        echo "=== Log preparation complete ==="

    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: logs-shard-${{ matrix.shard }}
        path: logs/
        if-no-files-found: ignore
        retention-days: 90

  # Single, stable required status check for staging->main releases. The
  # matrix above publishes per-shard checks ("pytest (0)".."pytest (7)"),
  # which branch protection cannot target by name -- so this job republishes
  # one "pytest" check that is green iff every shard passed.
  pytest-required:
    name: pytest
    needs: pytest
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Require all pytest shards to pass
      run: |
        result="${{ needs.pytest.result }}"
        echo "pytest matrix aggregate result: $result"
        if [[ "$result" == "success" ]]; then
          exit 0
        fi
        if [[ "$result" == "skipped" ]]; then
          echo "::error::Tests did not run for this commit, so the release gate"
          echo "::error::cannot pass."
        fi
        exit 1
