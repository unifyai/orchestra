name: Cleanup Abandoned Provider Accounts

# A provider creates the connected account when the auth link is issued, not
# when the user authorises. An attempt the user walks away from therefore
# leaves a real account behind that no disconnect will ever reach — the user
# never believes they connected anything, so nothing prompts them to undo it.
#
# These accumulate at the rate people abandon OAuth popups. In production they
# outnumbered disconnected connections roughly ten to one.

on:
  # schedule:
    # Daily at 5:00 AM UTC
    # - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      older_than_seconds:
        description: Only release attempts idle at least this long
        required: false
        default: '3600'
      limit:
        description: Most accounts to release in one pass
        required: false
        default: '500'

jobs:
  cleanup_abandoned_provider_accounts:
    name: Cleanup Abandoned Provider Accounts
    runs-on: ubuntu-latest

    steps:
    - name: Call cleanup endpoint
      run: |
        older=${{ github.event.inputs.older_than_seconds || '3600' }}
        limit=${{ github.event.inputs.limit || '500' }}

        response=$(curl -s -w "\n%{http_code}" -X POST \
          "https://api.unify.ai/v0/admin/cleanup/abandoned-provider-accounts?older_than_seconds=${older}&limit=${limit}" \
          -H "Authorization: Bearer ${{ secrets.ORCHESTRA_ADMIN_KEY }}")

        http_code=$(echo "$response" | tail -1)
        body=$(echo "$response" | head -n -1)

        echo "Response: $body"
        echo "HTTP Status: $http_code"

        if [ "$http_code" != "200" ]; then
          echo "::error::Cleanup failed with status $http_code"
          exit 1
        fi
