steps:
- name: gcr.io/cloud-builders/docker
  entrypoint: 'bash'
  args: ['-c', 'docker pull $_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME:latest || true']
  id: Pull Docker Cache
- name: gcr.io/cloud-builders/docker
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    DOCKER_BUILDKIT=1 docker build \
      --cache-from $_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME:latest \
      --build-arg BUILDKIT_INLINE_CACHE=1 \
      -t $_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA \
      -f deploy/Dockerfile --target prod .
  id: Build Orchestra
- name: gcr.io/cloud-builders/docker
  args:
  - push
  - >-
    $_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
  id: Push Orchestra
  waitFor:
  - 'Build Orchestra'
- name: gcr.io/cloud-builders/docker
  args: ['tag', '$_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA', '$_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME:latest']
  id: Build Orchestra Latest
  waitFor:
  - 'Push Orchestra'
- name: gcr.io/cloud-builders/docker
  args:
  - push
  - >-
    $_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME:latest
  id: Push Orchestra Latest
  waitFor:
  - 'Build Orchestra Latest'
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  args:
  - run
  - jobs
  - update
  - $_JOB_NAME
  - >-
    --image=$_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
  - >-
    --labels=managed-by=gcp-cloud-build-deploy-cloud-run,commit-sha=$COMMIT_SHA,gcb-build-id=$BUILD_ID,gcb-trigger-id=$_TRIGGER_ID
  - '--region=$_JOB_REGION'
  - '--set-cloudsql-instances=$_CLOUDSQL_INSTANCE'
  - '--update-env-vars=ORCHESTRA_CLOUD_SQL_INSTANCE=$_CLOUDSQL_INSTANCE,DEPLOY_ENV=staging'
  - '--quiet'
  id: Update migration image
  entrypoint: gcloud
  waitFor:
  - 'Push Orchestra'
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  args:
  - run
  - jobs
  - update
  - $_REINDEX_JOB_NAME
  - >-
    --image=$_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
  - '--region=$_JOB_REGION'
  - '--update-env-vars=ORCHESTRA_BUILTINS_SYNC_FORCE_OVERRIDE=$_BUILTINS_SYNC_FORCE_OVERRIDE'
  - '--quiet'
  id: Update reindex job image
  entrypoint: gcloud
  waitFor:
  - 'Push Orchestra'
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  args:
  - run
  - jobs
  - update
  - $_PROMOTE_JOB_NAME
  - >-
    --image=$_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
  - '--region=$_JOB_REGION'
  - '--quiet'
  id: Update promote job image
  entrypoint: gcloud
  waitFor:
  - 'Push Orchestra'
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  args:
  - run
  - jobs
  - add-iam-policy-binding
  - $_PROMOTE_JOB_NAME
  - '--region=$_JOB_REGION'
  - '--member=serviceAccount:service-account@example.iam.gserviceaccount.com'
  - '--role=roles/run.jobsExecutorWithOverrides'
  - '--quiet'
  id: Ensure promote job IAM
  entrypoint: gcloud
  waitFor:
  - 'Update promote job image'
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  args:
  - run
  - jobs
  - update
  - $_BUILTINS_SEED_JOB_NAME
  - >-
    --image=$_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
  - '--region=$_JOB_REGION'
  - '--update-env-vars=PIPEDREAM_ENVIRONMENT=development'
  - >-
    --update-secrets=COMPOSIO_API_KEY=$_COMPOSIO_API_KEY_SECRET:latest,PIPEDREAM_CLIENT_ID=PIPEDREAM_CLIENT_ID:latest,PIPEDREAM_CLIENT_SECRET=PIPEDREAM_CLIENT_SECRET:latest,PIPEDREAM_PROJECT_ID=PIPEDREAM_PROJECT_ID:latest
  - '--quiet'
  id: Update builtins seed job image
  entrypoint: gcloud
  waitFor:
  - 'Push Orchestra'
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  args:
  - run
  - jobs
  - add-iam-policy-binding
  - $_BUILTINS_SEED_JOB_NAME
  - '--region=$_JOB_REGION'
  - '--member=serviceAccount:service-account@example.iam.gserviceaccount.com'
  - '--role=roles/run.jobsExecutorWithOverrides'
  - '--quiet'
  id: Ensure builtins seed job IAM
  entrypoint: gcloud
  waitFor:
  - 'Update builtins seed job image'
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  args:
  - run
  - jobs
  - execute
  - $_JOB_NAME
  - '--region=$_JOB_REGION'
  - '--wait'
  id: Migrate
  entrypoint: gcloud
  waitFor:
  - 'Update migration image'
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  args:
  - '-c'
  - |
    set -euo pipefail
    run_cloud_run_with_retry() {
      local attempt max_attempts delay output output_file sleep_for status
      max_attempts=5
      delay=5
      for attempt in $$(seq 1 "$$max_attempts"); do
        output_file=$$(mktemp)
        set +e
        (set -e; "$${@}") > "$$output_file" 2>&1
        status=$$?
        set -e
        output=$$(cat "$$output_file")
        rm -f "$$output_file"
        printf '%s\n' "$$output"
        if [ "$$status" -eq 0 ]; then
          return 0
        fi
        if [[ "$$output" != *"ABORTED: Conflict for resource"* || "$$output" != *"was specified but current version is"* || "$$attempt" -eq "$$max_attempts" ]]; then
          return "$$status"
        fi
        sleep_for=$$((delay + RANDOM % 5))
        echo "Cloud Run service changed concurrently; retrying in $${sleep_for}s before attempt $$((attempt + 1))/$$max_attempts" >&2
        sleep "$$sleep_for"
        delay=$$((delay * 2))
      done
    }
    repair_traffic_state() {
      local to_revisions=()
      declare -A status_tags=()
      declare -A spec_tags=()
      while IFS='|' read -r rev pct tag; do
        [ -z "$$rev" ] && continue
        if [ -n "$$pct" ] && [ "$$pct" -gt 0 ] 2>/dev/null; then
          to_revisions+=("$$rev=$$pct")
        fi
        [ -n "$$tag" ] && status_tags["$$tag"]="$$rev"
      done < <(gcloud run services describe $_SERVICE_NAME \
        --region=$_DEPLOY_REGION \
        --platform=managed \
        --flatten='status.traffic[]' \
        --format='csv[no-heading,separator="|"](status.traffic.revisionName,status.traffic.percent,status.traffic.tag)')
      if [ "$${#to_revisions[@]}" -eq 0 ]; then
        echo "No live traffic revision found to preserve" >&2
        return 1
      fi
      while IFS='|' read -r rev pct tag; do
        [ -n "$$tag" ] && spec_tags["$$tag"]="$$rev"
      done < <(gcloud run services describe $_SERVICE_NAME \
        --region=$_DEPLOY_REGION \
        --platform=managed \
        --flatten='spec.traffic[]' \
        --format='csv[no-heading,separator="|"](spec.traffic.revisionName,spec.traffic.percent,spec.traffic.tag)')
      local update_tags=()
      local remove_tags=()
      local t
      for t in "$${!status_tags[@]}"; do
        if [ "$${spec_tags[$$t]:-}" != "$${status_tags[$$t]}" ]; then
          update_tags+=("$$t=$${status_tags[$$t]}")
        fi
      done
      for t in "$${!spec_tags[@]}"; do
        if [ -z "$${status_tags[$$t]:-}" ]; then
          remove_tags+=("$$t")
        fi
      done
      local traffic_args=(--to-revisions="$$(IFS=,; echo "$${to_revisions[*]}")")
      if [ "$${#update_tags[@]}" -gt 0 ]; then
        traffic_args+=(--update-tags="$$(IFS=,; echo "$${update_tags[*]}")")
      fi
      if [ "$${#remove_tags[@]}" -gt 0 ]; then
        traffic_args+=(--remove-tags="$$(IFS=,; echo "$${remove_tags[*]}")")
      fi
      run_cloud_run_with_retry gcloud run services update-traffic $_SERVICE_NAME \
        --region=$_DEPLOY_REGION \
        --platform=managed \
        "$${traffic_args[@]}" \
        --quiet
    }
    run_cloud_run_with_retry repair_traffic_state
  id: Repair Traffic State
  entrypoint: bash
  waitFor:
  - 'Migrate'
  - 'Push Orchestra Latest'
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: Deploy Orchestra
  entrypoint: bash
  args:
  - '-c'
  - |
    set -euo pipefail
    run_cloud_run_with_retry() {
      local attempt max_attempts delay output output_file sleep_for status
      max_attempts=5
      delay=5
      for attempt in $$(seq 1 "$$max_attempts"); do
        output_file=$$(mktemp)
        set +e
        (set -e; "$${@}") > "$$output_file" 2>&1
        status=$$?
        set -e
        output=$$(cat "$$output_file")
        rm -f "$$output_file"
        printf '%s\n' "$$output"
        if [ "$$status" -eq 0 ]; then
          return 0
        fi
        if [[ "$$output" != *"ABORTED: Conflict for resource"* || "$$output" != *"was specified but current version is"* || "$$attempt" -eq "$$max_attempts" ]]; then
          return "$$status"
        fi
        sleep_for=$$((delay + RANDOM % 5))
        echo "Cloud Run service changed concurrently; retrying in $${sleep_for}s before attempt $$((attempt + 1))/$$max_attempts" >&2
        sleep "$$sleep_for"
        delay=$$((delay * 2))
      done
    }
    run_cloud_run_with_retry gcloud \
      run \
      services \
      update \
      $_SERVICE_NAME \
      --platform=managed \
      --image=$_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA \
      --labels=managed-by=gcp-cloud-build-deploy-cloud-run,commit-sha=$COMMIT_SHA,gcb-build-id=$BUILD_ID,gcb-trigger-id=$_TRIGGER_ID \
      --region=$_DEPLOY_REGION \
      --quiet \
      --concurrency=20 \
      --set-cloudsql-instances=$_CLOUDSQL_INSTANCE \
      --vpc-connector=orchestra-connector-usc1 \
      --vpc-egress=all-traffic \
      --cpu-throttling \
      --cpu-boost \
      --update-env-vars=ORCHESTRA_CLOUD_SQL_INSTANCE=$_CLOUDSQL_INSTANCE,DEPLOY_ENV=staging,PIPEDREAM_ENVIRONMENT=development,UNITY_COMMS_URL=https://service.a.run.app,UNITY_ADAPTERS_URL=https://service.a.run.app,ORCHESTRA_BUILTINS_SEED_JOB_NAME=$_BUILTINS_SEED_JOB_NAME,ORCHESTRA_BUILTINS_SEED_JOB_REGION=$_JOB_REGION,ORCHESTRA_BUILTINS_SYNC_FORCE_OVERRIDE=$_BUILTINS_SYNC_FORCE_OVERRIDE,ORCHESTRA_PARTITION_PROMOTE_JOB_NAME=$_PROMOTE_JOB_NAME,ORCHESTRA_PARTITION_PROMOTE_JOB_REGION=$_JOB_REGION,ORCHESTRA_UNIQUE_VALIDATION_MODE=lookup_table,ORCHESTRA_TRIGGER_CALLBACK_BASE_URL=$_TRIGGER_CALLBACK_BASE_URL,TRIGGER_EVENT_PRIVATE_BUCKET=$_TRIGGER_EVENT_PRIVATE_BUCKET,TRIGGER_EVENT_KMS_KEYRING=$_TRIGGER_EVENT_KMS_KEYRING,TRIGGER_EVENT_KMS_KEY=$_TRIGGER_EVENT_KMS_KEY,NATIVE_GOOGLE_WORKSPACE_EVENTS_PUBSUB_TOPIC=$_NATIVE_GOOGLE_WORKSPACE_EVENTS_PUBSUB_TOPIC,REQUIRE_CARD_ON_FILE=false,REQUIRE_API_PAYMENT_HISTORY=true \
      --update-secrets=COMPOSIO_API_KEY=$_COMPOSIO_API_KEY_SECRET:latest,COMPOSIO_WEBHOOK_SECRET=$_COMPOSIO_WEBHOOK_SECRET:latest,PIPEDREAM_CLIENT_ID=PIPEDREAM_CLIENT_ID:latest,PIPEDREAM_CLIENT_SECRET=PIPEDREAM_CLIENT_SECRET:latest,PIPEDREAM_PROJECT_ID=PIPEDREAM_PROJECT_ID:latest,UNITY_COORDINATOR_EMAIL_ADDRESS=UNITY_COORDINATOR_EMAIL_ADDRESS_STAGING:latest,UNITY_COORDINATOR_PHONE_UK=UNITY_COORDINATOR_PHONE_UK_STAGING:latest,UNITY_COORDINATOR_PHONE_US=UNITY_COORDINATOR_PHONE_US_STAGING:latest,UNITY_COORDINATOR_DISCORD_ID=UNITY_COORDINATOR_DISCORD_ID_STAGING:latest,UNITY_COORDINATOR_DISCORD_TOKEN=UNITY_COORDINATOR_DISCORD_TOKEN_STAGING:latest,UNITY_COORDINATOR_WHATSAPP_NUMBER=UNITY_COORDINATOR_WHATSAPP_NUMBER_STAGING:latest,SLACK_CLIENT_ID=SLACK_CLIENT_ID:latest,SLACK_CLIENT_SECRET=SLACK_CLIENT_SECRET:latest,NATIVE_GOOGLE_WEBHOOK_SECRET=$_NATIVE_GOOGLE_WEBHOOK_SECRET:latest,NATIVE_MICROSOFT_WEBHOOK_SECRET=$_NATIVE_MICROSOFT_WEBHOOK_SECRET:latest

  waitFor:
  - 'Repair Traffic State'
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  entrypoint: bash
  args:
  - '-c'
  - |
    set -euo pipefail
    run_cloud_run_with_retry() {
      local attempt max_attempts delay output output_file sleep_for status
      max_attempts=5
      delay=5
      for attempt in $$(seq 1 "$$max_attempts"); do
        output_file=$$(mktemp)
        set +e
        (set -e; "$${@}") > "$$output_file" 2>&1
        status=$$?
        set -e
        output=$$(cat "$$output_file")
        rm -f "$$output_file"
        printf '%s\n' "$$output"
        if [ "$$status" -eq 0 ]; then
          return 0
        fi
        if [[ "$$output" != *"ABORTED: Conflict for resource"* || "$$output" != *"was specified but current version is"* || "$$attempt" -eq "$$max_attempts" ]]; then
          return "$$status"
        fi
        sleep_for=$$((delay + RANDOM % 5))
        echo "Cloud Run service changed concurrently; retrying in $${sleep_for}s before attempt $$((attempt + 1))/$$max_attempts" >&2
        sleep "$$sleep_for"
        delay=$$((delay * 2))
      done
    }
    # Use the same runtime SA as orchestra-staging. A bare `gcloud run deploy` of a
    # new service defaults to PROJECT_NUMBER-compute@developer.gserviceaccount.com,
    # which this Cloud Build SA cannot actAs.
    run_cloud_run_with_retry gcloud run deploy $_TRIGGER_WORKER_SERVICE_NAME \
      --platform=managed \
      --image=$_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA \
      --region=$_DEPLOY_REGION \
      --quiet \
      --service-account=default-compute@$PROJECT_ID.iam.gserviceaccount.com \
      --command=python \
      --args=-m,orchestra.workers.provider_trigger_worker \
      --min-instances=1 \
      --max-instances=2 \
      --concurrency=1 \
      --no-cpu-throttling \
      --no-allow-unauthenticated \
      --ingress=internal \
      --set-cloudsql-instances=$_CLOUDSQL_INSTANCE \
      --vpc-connector=orchestra-connector-usc1 \
      --vpc-egress=all-traffic \
      --labels=managed-by=gcp-cloud-build-deploy-cloud-run,commit-sha=$COMMIT_SHA,gcb-build-id=$BUILD_ID,gcb-trigger-id=$_TRIGGER_ID \
      --update-env-vars=ORCHESTRA_CLOUD_SQL_INSTANCE=$_CLOUDSQL_INSTANCE,DEPLOY_ENV=staging,UNITY_COMMS_URL=https://service.a.run.app,UNITY_ADAPTERS_URL=https://service.a.run.app,ORCHESTRA_TRIGGER_CALLBACK_BASE_URL=$_TRIGGER_CALLBACK_BASE_URL,TRIGGER_EVENT_PRIVATE_BUCKET=$_TRIGGER_EVENT_PRIVATE_BUCKET,TRIGGER_EVENT_KMS_KEYRING=$_TRIGGER_EVENT_KMS_KEYRING,TRIGGER_EVENT_KMS_KEY=$_TRIGGER_EVENT_KMS_KEY,NATIVE_GOOGLE_WORKSPACE_EVENTS_PUBSUB_TOPIC=$_NATIVE_GOOGLE_WORKSPACE_EVENTS_PUBSUB_TOPIC \
      --update-secrets=COMPOSIO_API_KEY=$_COMPOSIO_API_KEY_SECRET:latest,COMPOSIO_WEBHOOK_SECRET=$_COMPOSIO_WEBHOOK_SECRET:latest,PIPEDREAM_CLIENT_ID=PIPEDREAM_CLIENT_ID:latest,PIPEDREAM_CLIENT_SECRET=PIPEDREAM_CLIENT_SECRET:latest,PIPEDREAM_PROJECT_ID=PIPEDREAM_PROJECT_ID:latest,ORCHESTRA_DB_USER=ORCHESTRA_STAGING_DB_USER:latest,ORCHESTRA_DB_PASS=ORCHESTRA_STAGING_SSD_DB_PASSWORD:latest,ORCHESTRA_DB_BASE=ORCHESTRA_STAGING_DB_BASE:latest,ORCHESTRA_ADMIN_KEY=ORCHESTRA_ADMIN_KEY:latest,NATIVE_GOOGLE_WEBHOOK_SECRET=$_NATIVE_GOOGLE_WEBHOOK_SECRET:latest,NATIVE_MICROSOFT_WEBHOOK_SECRET=$_NATIVE_MICROSOFT_WEBHOOK_SECRET:latest
  id: Deploy Trigger Worker
  waitFor:
  - 'Deploy Orchestra'
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  args:
  - '-c'
  - |
    set -euo pipefail
    run_cloud_run_with_retry() {
      local attempt max_attempts delay output output_file sleep_for status
      max_attempts=5
      delay=5
      for attempt in $$(seq 1 "$$max_attempts"); do
        output_file=$$(mktemp)
        set +e
        (set -e; "$${@}") > "$$output_file" 2>&1
        status=$$?
        set -e
        output=$$(cat "$$output_file")
        rm -f "$$output_file"
        printf '%s\n' "$$output"
        if [ "$$status" -eq 0 ]; then
          return 0
        fi
        if [[ "$$output" != *"ABORTED: Conflict for resource"* || "$$output" != *"was specified but current version is"* || "$$attempt" -eq "$$max_attempts" ]]; then
          return "$$status"
        fi
        sleep_for=$$((delay + RANDOM % 5))
        echo "Cloud Run service changed concurrently; retrying in $${sleep_for}s before attempt $$((attempt + 1))/$$max_attempts" >&2
        sleep "$$sleep_for"
        delay=$$((delay * 2))
      done
    }
    route_canonical_traffic() {
      REVISION=$$(gcloud run services describe $_SERVICE_NAME \
        --region=$_DEPLOY_REGION \
        --platform=managed \
        --format="value(status.latestCreatedRevisionName)")
      if [ -z "$$REVISION" ]; then
        echo "No deployed revision found for build $BUILD_ID" >&2
        return 1
      fi
      REVISION_BUILD_ID=$$(gcloud run revisions describe "$$REVISION" \
        --region=$_DEPLOY_REGION \
        --format="value(metadata.labels.gcb-build-id)")
      if [ "$$REVISION_BUILD_ID" != "$BUILD_ID" ]; then
        echo "Skipping traffic route for $$REVISION because it belongs to build $$REVISION_BUILD_ID"
        return 0
      fi
      gcloud run services update-traffic $_SERVICE_NAME \
        --platform=managed \
        --region=$_DEPLOY_REGION \
        --to-revisions="$$REVISION=100" \
        --quiet
    }
    run_cloud_run_with_retry route_canonical_traffic
  id: Route Orchestra Traffic
  entrypoint: bash
  waitFor:
  - 'Deploy Orchestra'
images:
- $_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
- $_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME:latest
