steps:
- name: gcr.io/cloud-builders/docker
  entrypoint: 'bash'
  args: ['-c', 'docker pull $_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME:latest || true']
  id: Pull Docker Cache
- name: gcr.io/cloud-builders/docker
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    DOCKER_BUILDKIT=1 docker build \
      --cache-from $_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME:latest \
      --build-arg BUILDKIT_INLINE_CACHE=1 \
      -t $_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA \
      -f deploy/Dockerfile --target prod .
  id: Build Orchestra
- name: gcr.io/cloud-builders/docker
  args:
  - push
  - >-
    $_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
  id: Push Orchestra
  waitFor:
  - 'Build Orchestra'
- name: gcr.io/cloud-builders/docker
  args: ['tag', '$_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA', '$_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME:latest']
  id: Build Orchestra Latest
  waitFor:
  - 'Push Orchestra'
- name: gcr.io/cloud-builders/docker
  args:
  - push
  - >-
    $_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME:latest
  id: Push Orchestra Latest
  waitFor:
  - 'Build Orchestra Latest'
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  args:
  - run
  - jobs
  - update
  - $_JOB_NAME
  - >-
    --image=$_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
  - >-
    --labels=managed-by=gcp-cloud-build-deploy-cloud-run,commit-sha=$COMMIT_SHA,gcb-build-id=$BUILD_ID,gcb-trigger-id=$_TRIGGER_ID
  - '--region=$_JOB_REGION'
  - '--set-cloudsql-instances=$_CLOUDSQL_INSTANCE'
  - '--update-env-vars=ORCHESTRA_CLOUD_SQL_INSTANCE=$_CLOUDSQL_INSTANCE,DEPLOY_ENV=production'
  - '--quiet'
  id: Update migration image
  entrypoint: gcloud
  waitFor:
  - 'Push Orchestra'
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  args:
  - run
  - jobs
  - update
  - $_REINDEX_JOB_NAME
  - >-
    --image=$_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
  - '--region=$_JOB_REGION'
  - '--quiet'
  id: Update reindex job image
  entrypoint: gcloud
  waitFor:
  - 'Push Orchestra'
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  args:
  - run
  - jobs
  - execute
  - $_JOB_NAME
  - '--region=$_JOB_REGION'
  - '--wait'
  id: Migrate
  entrypoint: gcloud
  waitFor:
  - 'Update migration image'
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  args:
  - run
  - services
  - update
  - $_SERVICE_NAME
  - '--platform=managed'
  - >-
    --image=$_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
  - >-
    --labels=managed-by=gcp-cloud-build-deploy-cloud-run,commit-sha=$COMMIT_SHA,gcb-build-id=$BUILD_ID,gcb-trigger-id=$_TRIGGER_ID
  - '--region=$_DEPLOY_REGION'
  - '--quiet'
  - '--vpc-connector=orchestra-connector-v2'
  - '--vpc-egress=all-traffic'
  - '--no-cpu-throttling'
  - '--cpu-boost'
  - '--update-env-vars=ORCHESTRA_CLOUD_SQL_INSTANCE=$_CLOUDSQL_INSTANCE,DEPLOY_ENV=production,PIPEDREAM_ENVIRONMENT=production'
  - '--update-secrets=COMPOSIO_API_KEY=COMPOSIO_API_KEY:latest,PIPEDREAM_CLIENT_ID=PIPEDREAM_CLIENT_ID:latest,PIPEDREAM_CLIENT_SECRET=PIPEDREAM_CLIENT_SECRET:latest,PIPEDREAM_PROJECT_ID=PIPEDREAM_PROJECT_ID:latest,UNITY_COORDINATOR_EMAIL_ADDRESS=UNITY_COORDINATOR_EMAIL_ADDRESS_PRODUCTION:latest,UNITY_COORDINATOR_PHONE_UK=UNITY_COORDINATOR_PHONE_UK_PRODUCTION:latest,UNITY_COORDINATOR_PHONE_US=UNITY_COORDINATOR_PHONE_US_PRODUCTION:latest,UNITY_COORDINATOR_DISCORD_ID=UNITY_COORDINATOR_DISCORD_ID_PRODUCTION:latest,UNITY_COORDINATOR_DISCORD_TOKEN=UNITY_COORDINATOR_DISCORD_TOKEN_PRODUCTION:latest'
  id: Deploy Orchestra
  entrypoint: gcloud
  waitFor:
  - 'Migrate'
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: Bootstrap Provider Integrations
  entrypoint: bash
  secretEnv: ['ORCHESTRA_ADMIN_KEY']
  args:
  - '-c'
  - |
    set -euo pipefail
    SERVICE_JSON=$$(mktemp)
    gcloud run services describe $_SERVICE_NAME \
      --region=$_DEPLOY_REGION \
      --platform=managed \
      --format=json > "$$SERVICE_JSON"
    export ORCHESTRA_URL=$$(python3 - "$$SERVICE_JSON" <<'PY'
    import json
    import sys

    with open(sys.argv[1], encoding="utf-8") as service_file:
        service = json.load(service_file)

    for container in service.get("spec", {}).get("template", {}).get("spec", {}).get("containers", []):
        for item in container.get("env", []) or []:
            if item.get("name") == "ORCHESTRA_URL" and item.get("value"):
                print(item["value"].rstrip("/"))
                raise SystemExit(0)
    PY
    )
    rm -f "$$SERVICE_JSON"
    if [ -z "$$ORCHESTRA_URL" ]; then
      echo "ORCHESTRA_URL is not set on Cloud Run service $_SERVICE_NAME" >&2
      exit 1
    fi
    PYTHONUNBUFFERED=1 python3 -u scripts/cloud_bootstrap_provider_integrations.py \
      --manifest "$_INTEGRATION_BOOTSTRAP_MANIFEST"
  waitFor:
  - 'Deploy Orchestra'
images:
- $_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
- $_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME:latest
options:
  substitutionOption: ALLOW_LOOSE
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
substitutions:
  _JOB_REGION: europe-west3
  _SERVICE_NAME: orchestra
  _TRIGGER_ID: 0bfee4b7-25c8-453a-8484-fca72480864c
  REPO_NAME: orchestra
  _DEPLOY_REGION: europe-west1
  _AR_HOSTNAME: europe-west3-docker.pkg.dev
  _PLATFORM: managed
  _JOB_NAME: orchestra-migrator
  _REINDEX_JOB_NAME: orchestra-index-maintenance-reindex
  _CLOUDSQL_INSTANCE: gcp-project-saas:europe-west3:prod-ssd
  _INTEGRATION_BOOTSTRAP_MANIFEST: deploy/integrations/bootstrap.production.toml
availableSecrets:
  secretManager:
  - versionName: projects/${PROJECT_ID}/secrets/ORCHESTRA_ADMIN_KEY/versions/latest
    env: 'ORCHESTRA_ADMIN_KEY'
tags:
- gcp-cloud-build-deploy-cloud-run
- gcp-cloud-build-deploy-cloud-run-managed
- orchestra
