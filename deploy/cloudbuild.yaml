steps:
- name: gcr.io/cloud-builders/docker
  entrypoint: 'bash'
  args: ['-c', 'docker pull $_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME:latest || true']
  id: Pull Docker Cache
- name: gcr.io/cloud-builders/docker
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    DOCKER_BUILDKIT=1 docker build \
      --cache-from $_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME:latest \
      --build-arg BUILDKIT_INLINE_CACHE=1 \
      -t $_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA \
      -f deploy/Dockerfile --target prod .
  id: Build Orchestra
- name: gcr.io/cloud-builders/docker
  args:
  - push
  - >-
    $_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
  id: Push Orchestra
  waitFor:
  - 'Build Orchestra'
- name: gcr.io/cloud-builders/docker
  args: ['tag', '$_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA', '$_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME:latest']
  id: Build Orchestra Latest
  waitFor:
  - 'Push Orchestra'
- name: gcr.io/cloud-builders/docker
  args:
  - push
  - >-
    $_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME:latest
  id: Push Orchestra Latest
  waitFor:
  - 'Build Orchestra Latest'
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  args:
  - run
  - jobs
  - update
  - $_JOB_NAME
  - >-
    --image=$_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
  - >-
    --labels=managed-by=gcp-cloud-build-deploy-cloud-run,commit-sha=$COMMIT_SHA,gcb-build-id=$BUILD_ID,gcb-trigger-id=$_TRIGGER_ID
  - '--region=$_JOB_REGION'
  - '--set-cloudsql-instances=$_CLOUDSQL_INSTANCE'
  - '--update-env-vars=ORCHESTRA_CLOUD_SQL_INSTANCE=$_CLOUDSQL_INSTANCE,DEPLOY_ENV=production'
  - '--quiet'
  id: Update migration image
  entrypoint: gcloud
  waitFor:
  - 'Push Orchestra'
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  args:
  - run
  - jobs
  - update
  - $_REINDEX_JOB_NAME
  - >-
    --image=$_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
  - '--region=$_JOB_REGION'
  - '--update-env-vars=ORCHESTRA_BUILTINS_SYNC_FORCE_OVERRIDE=$_BUILTINS_SYNC_FORCE_OVERRIDE'
  - '--quiet'
  id: Update reindex job image
  entrypoint: gcloud
  waitFor:
  - 'Push Orchestra'
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  args:
  - run
  - jobs
  - update
  - $_PROMOTE_JOB_NAME
  - >-
    --image=$_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
  - '--region=$_JOB_REGION'
  - '--quiet'
  id: Update promote job image
  entrypoint: gcloud
  waitFor:
  - 'Push Orchestra'
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  args:
  - run
  - jobs
  - update
  - $_BUILTINS_SEED_JOB_NAME
  - >-
    --image=$_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
  - '--region=$_JOB_REGION'
  - '--update-env-vars=PIPEDREAM_ENVIRONMENT=production'
  - >-
    --update-secrets=COMPOSIO_API_KEY=$_COMPOSIO_API_KEY_SECRET:latest,PIPEDREAM_CLIENT_ID=PIPEDREAM_CLIENT_ID:latest,PIPEDREAM_CLIENT_SECRET=PIPEDREAM_CLIENT_SECRET:latest,PIPEDREAM_PROJECT_ID=PIPEDREAM_PROJECT_ID:latest
  - '--quiet'
  id: Update builtins seed job image
  entrypoint: gcloud
  waitFor:
  - 'Push Orchestra'
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  args:
  - run
  - jobs
  - add-iam-policy-binding
  - $_BUILTINS_SEED_JOB_NAME
  - '--region=$_JOB_REGION'
  - '--member=serviceAccount:service-account@example.iam.gserviceaccount.com'
  - '--role=roles/run.jobsExecutorWithOverrides'
  - '--quiet'
  id: Ensure builtins seed job IAM
  entrypoint: gcloud
  waitFor:
  - 'Update builtins seed job image'
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  args:
  - run
  - jobs
  - execute
  - $_JOB_NAME
  - '--region=$_JOB_REGION'
  - '--wait'
  id: Migrate
  entrypoint: gcloud
  waitFor:
  - 'Update migration image'
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  args:
  - run
  - services
  - update
  - $_SERVICE_NAME
  - '--platform=managed'
  - >-
    --image=$_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
  - >-
    --labels=managed-by=gcp-cloud-build-deploy-cloud-run,commit-sha=$COMMIT_SHA,gcb-build-id=$BUILD_ID,gcb-trigger-id=$_TRIGGER_ID
  - '--region=$_DEPLOY_REGION'
  - '--quiet'
  - '--min-instances=1'
  - '--concurrency=20'
  - '--set-cloudsql-instances=$_CLOUDSQL_INSTANCE'
  - '--vpc-connector=orchestra-connector-usc1'
  - '--vpc-egress=all-traffic'
  - '--cpu-throttling'
  - '--cpu-boost'
  - '--update-env-vars=ORCHESTRA_CLOUD_SQL_INSTANCE=$_CLOUDSQL_INSTANCE,DEPLOY_ENV=production,PIPEDREAM_ENVIRONMENT=production,UNITY_COMMS_URL=https://service.a.run.app,UNITY_ADAPTERS_URL=https://service.a.run.app,ORCHESTRA_BUILTINS_SEED_JOB_NAME=$_BUILTINS_SEED_JOB_NAME,ORCHESTRA_BUILTINS_SEED_JOB_REGION=$_JOB_REGION,ORCHESTRA_BUILTINS_SYNC_FORCE_OVERRIDE=$_BUILTINS_SYNC_FORCE_OVERRIDE,ORCHESTRA_UNIQUE_VALIDATION_MODE=lookup_table,ORCHESTRA_TRIGGER_CALLBACK_BASE_URL=$_TRIGGER_CALLBACK_BASE_URL,TRIGGER_EVENT_PRIVATE_BUCKET=$_TRIGGER_EVENT_PRIVATE_BUCKET,TRIGGER_EVENT_KMS_KEYRING=$_TRIGGER_EVENT_KMS_KEYRING,TRIGGER_EVENT_KMS_KEY=$_TRIGGER_EVENT_KMS_KEY'
  - '--update-secrets=COMPOSIO_API_KEY=$_COMPOSIO_API_KEY_SECRET:latest,COMPOSIO_WEBHOOK_SECRET=$_COMPOSIO_WEBHOOK_SECRET:latest,PIPEDREAM_CLIENT_ID=PIPEDREAM_CLIENT_ID:latest,PIPEDREAM_CLIENT_SECRET=PIPEDREAM_CLIENT_SECRET:latest,PIPEDREAM_PROJECT_ID=PIPEDREAM_PROJECT_ID:latest,UNITY_COORDINATOR_EMAIL_ADDRESS=UNITY_COORDINATOR_EMAIL_ADDRESS_PRODUCTION:latest,UNITY_COORDINATOR_PHONE_UK=UNITY_COORDINATOR_PHONE_UK_PRODUCTION:latest,UNITY_COORDINATOR_PHONE_US=UNITY_COORDINATOR_PHONE_US_PRODUCTION:latest,UNITY_COORDINATOR_DISCORD_ID=UNITY_COORDINATOR_DISCORD_ID_PRODUCTION:latest,UNITY_COORDINATOR_DISCORD_TOKEN=UNITY_COORDINATOR_DISCORD_TOKEN_PRODUCTION:latest,UNITY_COORDINATOR_WHATSAPP_NUMBER=UNITY_COORDINATOR_WHATSAPP_NUMBER_PRODUCTION:latest,SLACK_CLIENT_ID=SLACK_CLIENT_ID_PROD:latest,SLACK_CLIENT_SECRET=SLACK_CLIENT_SECRET_PROD:latest,SMARTLEAD_API_KEY=SMARTLEAD_API_KEY:latest'
  id: Deploy Orchestra
  entrypoint: gcloud
  waitFor:
  - 'Migrate'
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  entrypoint: bash
  args:
  - '-c'
  - |
    set -euo pipefail
    # Use the same runtime SA as orchestra. A bare `gcloud run deploy` of a new
    # service defaults to PROJECT_NUMBER-compute@developer.gserviceaccount.com,
    # which this Cloud Build SA cannot actAs.
    gcloud run deploy $_TRIGGER_WORKER_SERVICE_NAME \
      --platform=managed \
      --image=$_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA \
      --region=$_DEPLOY_REGION \
      --quiet \
      --service-account=default-compute@$PROJECT_ID.iam.gserviceaccount.com \
      --command=python \
      --args=-m,orchestra.workers.provider_trigger_worker \
      --min-instances=1 \
      --max-instances=2 \
      --concurrency=1 \
      --no-cpu-throttling \
      --no-allow-unauthenticated \
      --ingress=internal \
      --set-cloudsql-instances=$_CLOUDSQL_INSTANCE \
      --vpc-connector=orchestra-connector-usc1 \
      --vpc-egress=all-traffic \
      --labels=managed-by=gcp-cloud-build-deploy-cloud-run,commit-sha=$COMMIT_SHA,gcb-build-id=$BUILD_ID,gcb-trigger-id=$_TRIGGER_ID \
      --update-env-vars=ORCHESTRA_CLOUD_SQL_INSTANCE=$_CLOUDSQL_INSTANCE,DEPLOY_ENV=production,UNITY_COMMS_URL=https://service.a.run.app,UNITY_ADAPTERS_URL=https://service.a.run.app,ORCHESTRA_TRIGGER_CALLBACK_BASE_URL=$_TRIGGER_CALLBACK_BASE_URL,TRIGGER_EVENT_PRIVATE_BUCKET=$_TRIGGER_EVENT_PRIVATE_BUCKET,TRIGGER_EVENT_KMS_KEYRING=$_TRIGGER_EVENT_KMS_KEYRING,TRIGGER_EVENT_KMS_KEY=$_TRIGGER_EVENT_KMS_KEY \
      --update-secrets=COMPOSIO_API_KEY=$_COMPOSIO_API_KEY_SECRET:latest,COMPOSIO_WEBHOOK_SECRET=$_COMPOSIO_WEBHOOK_SECRET:latest,PIPEDREAM_CLIENT_ID=PIPEDREAM_CLIENT_ID:latest,PIPEDREAM_CLIENT_SECRET=PIPEDREAM_CLIENT_SECRET:latest,PIPEDREAM_PROJECT_ID=PIPEDREAM_PROJECT_ID:latest,ORCHESTRA_DB_USER=ORCHESTRA_DB_USER:latest,ORCHESTRA_DB_PASS=ORCHESTRA_SSD_DB_PASSWORD:latest,ORCHESTRA_DB_BASE=ORCHESTRA_DB_BASE:latest,ORCHESTRA_ADMIN_KEY=ORCHESTRA_ADMIN_KEY:latest
  id: Deploy Trigger Worker
  waitFor:
  - 'Deploy Orchestra'
images:
- $_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
- $_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME:latest
timeout: 14400s
options:
  substitutionOption: ALLOW_LOOSE
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
substitutions:
  _JOB_REGION: us-central1
  _SERVICE_NAME: orchestra
  _TRIGGER_ID: 0bfee4b7-25c8-453a-8484-fca72480864c
  REPO_NAME: orchestra
  _DEPLOY_REGION: us-central1
  _AR_HOSTNAME: us-central1-docker.pkg.dev
  _PLATFORM: managed
  _JOB_NAME: orchestra-migrator
  _REINDEX_JOB_NAME: orchestra-index-maintenance-reindex
  _PROMOTE_JOB_NAME: orchestra-partition-promote
  _BUILTINS_SEED_JOB_NAME: orchestra-builtins-seed
  _BUILTINS_SYNC_FORCE_OVERRIDE: ''
  _CLOUDSQL_INSTANCE: gcp-project-saas:us-central1:prod-ssd-usc1
  _TRIGGER_WORKER_SERVICE_NAME: orchestra-trigger-worker
  _COMPOSIO_API_KEY_SECRET: COMPOSIO_API_KEY
  _COMPOSIO_WEBHOOK_SECRET: COMPOSIO_WEBHOOK_SECRET
  _TRIGGER_CALLBACK_BASE_URL: https://api.unify.ai
  _TRIGGER_EVENT_PRIVATE_BUCKET: provider-event-blobs
  _TRIGGER_EVENT_KMS_KEYRING: provider-triggers
  _TRIGGER_EVENT_KMS_KEY: event-blob-keys
tags:
- gcp-cloud-build-deploy-cloud-run
- gcp-cloud-build-deploy-cloud-run-managed
- orchestra
