[project]
name = "orchestra"
version = "0.0.0"
description = "Backend API and persistence layer for Unity and the wider Unify stack"
authors = [{ name = "Unify", email = "hello@unify.ai" }]
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = "MIT"
maintainers = [{ name = "Unify", email = "hello@unify.ai" }]
# Pinned to 3.12.x: several core deps (asyncpg 0.28, etc.) lack
# Python 3.13 wheels and would otherwise fall back to source builds requiring
# a Rust toolchain or unavailable system headers. Bump explicitly when those
# deps publish 3.13 wheels.
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "fastapi>=0.135.0,<0.136",
    "uvicorn[standard]>=0.22.0,<0.23",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "yarl>=1.9.2,<2",
    "ujson>=5.8.0,<6",
    "SQLAlchemy[asyncio]>=2.0.18,<3",
    "alembic>=1.11.1,<2",
    "asyncpg>=0.28.0,<0.29",
    "httptools>=0.6.0,<0.7",
    "prometheus-client>=0.17.0,<0.18",
    "prometheus-fastapi-instrumentator==6.0.0",
    "sentry-sdk>=2.62.0,<3",
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "opentelemetry-exporter-otlp>=1.29.0",
    "opentelemetry-instrumentation>=0.59b0",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.50b0",
    "loguru>=0.7.0,<0.8",
    "prettytable>=3.9.0,<4",
    "boto3>=1.34.131,<2",
    "botocore>=1.34.131,<2",
    "google-cloud-aiplatform>=1.131.0,<2",
    "psycopg2-binary>=2.9.9,<3",
    "tiktoken==0.12.0",
    "aiohttp>=3.14.3,<4",
    "replicate>=0.23.1,<0.24",
    "mutagen>=1.47.0,<2",
    "aioboto3>=13.1.1,<14",
    "google-cloud-logging>=3.9.0,<4",
    "anthropic>=0.29.0,<0.30",
    "stripe>=8.10.0,<9",
    "python-multipart>=0.0.27",
    "scipy>=1.13.0,<2",
    "google-cloud-storage>=3.0.0,<4",
    "google-cloud-run>=0.10.0,<0.11",
    "google-cloud-pubsub>=2.21.5,<3",
    "google-cloud-secret-manager>=2.20.1,<3",
    "pytest-xdist[psutil]>=3.6.1,<4",
    "redis>=5.0.7,<6",
    "shortuuid>=1.0.13,<2",
    "opencv-python>=4.10.0.84,<5",
    "imagehash>=4.3.1,<5",
    "Pillow>=12.3.0,<13",
    "python-json-logger>=3.2.1,<4",
    "python-logging-loki>=0.3.1,<0.4",
    "wget>=3.2,<4",
    "pgvector>=0.4.1,<0.5",
    "aiosmtplib>=4.0.1,<5",
    "google-api-python-client>=2.170.0,<3",
    "google-auth-httplib2>=0.2.0,<0.3",
    "httplib2>=0.32.0",
    "pyasn1>=0.6.4",
    "google-auth-oauthlib>=1.2.2,<2",
    "python-stdnum>=2.1,<3",
    "jsonschema>=4.25.1,<5",
    "pytest-shard>=0.1.2,<0.2",
    "phonenumbers>=9.0.21,<10",
    "opentelemetry-instrumentation-httpx>=0.60b1,<0.61",
    "cloud-sql-python-connector[pg8000]>=1.20.0,<2",
    "disposable-email-domains>=0.0.163,<0.0.164",
    "argon2-cffi>=25.1.0,<26",
    "cryptography>=50.0.0",
    "email-validator>=2.3.0,<3",
    "pyotp>=2.9.0,<3",
    "google-cloud-kms>=3.11.0,<4",
]

[project.urls]
Homepage = "https://github.com/unifyai/orchestra"
Repository = "https://github.com/unifyai/orchestra"
Documentation = "https://github.com/unifyai/orchestra"

[dependency-groups]
dev = [
    "types-requests",
    "pytest>=8.3.5,<9",
    "pytest-asyncio>=0.24.0,<0.25",
    "flake8~=4.0.1",
    "mypy>=1.1.1,<2",
    "pre-commit>=3.0.1,<4",
    "wemake-python-styleguide>=0.17.0,<0.18",
    "pytest-cov>=4.0.0,<5",
    "anyio>=4.8.0,<5",
    "pytest-env>=0.8.1,<0.9",
    "httpx>=0.28.0,<0.29",
    "hypothesis>=6.130.3,<7",
    "pytest-dotenv>=0.5.2,<0.6",
    "python-dotenv>=1.2.1,<2",
    { include-group = "lint" },
]
# Formatters are the single source of truth for the pinned versions CI and
# pre-commit both run. Keep them here (locked in uv.lock), not duplicated in
# the pre-commit hook.
lint = [
    "black>=26.3.1",
    "isort>=5.11.4,<6",
    "autoflake>=1.6.1,<2",
]

[tool.uv.build-backend]
module-root = ""

[tool.black]
target-version = ["py312"]
extend-exclude = '''
^/scripts/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
src_paths = ["orchestra",]

[tool.mypy]
strict = true
ignore_missing_imports = true
allow_subclassing_any = true
allow_untyped_calls = true
pretty = true
show_error_codes = true
implicit_reexport = true
allow_untyped_decorators = true
warn_unused_ignores = false
warn_return_any = false
namespace_packages = true

[tool.pytest.ini_options]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore:.*unclosed.*:ResourceWarning",
    "ignore::UserWarning",
]
env = [
    "ORCHESTRA_ENVIRONMENT=pytest",
    "ORCHESTRA_DB_BASE=orchestra_test",
    "ORCHESTRA_SENTRY_DSN=",
]
addopts = "--dist=loadgroup --cov --cov-report=lcov:lcov.info --cov-report=term"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "manual: marks tests as manual",
    "performance: long-running performance tests",
    "serial: marks tests that must run serially (not in parallel)",
    "integration: tests that call real third-party APIs (Stripe, GCP, etc.) — skipped in CI by default"
]

[fastapi-template.options]
project_name = "orchestra"
api_type = "rest"
enable_redis = "None"
enable_rmq = "None"
ci_type = "github"
enable_migrations = "True"
enable_taskiq = "None"
enable_kube = "None"
kube_name = "orchestra"
enable_routers = "True"
enable_kafka = "None"
enable_loguru = "True"
traefik_labels = "None"
add_dummy = "True"
orm = "sqlalchemy"
self_hosted_swagger = "None"
prometheus_enabled = "True"
sentry_enabled = "True"
otlp_enabled = "True"
pydanticv1 = "None"
gunicorn = "None"
add_users = "None"
cookie_auth = "None"
jwt_auth = "None"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
